name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-service
    env:
      CATALOG_ENVIRONMENT: test
      CATALOG_DATABASE_URL: sqlite:///./test.sqlite3
      CATALOG_JWT_SECRET: ci-only-long-random-secret-not-for-production
      CATALOG_CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/catalog-service/requirements.txt
            services/catalog-service/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: ruff check app scripts tests migrations
      - run: python -m compileall -q app scripts
      - run: python -m pytest -q --disable-warnings --maxfail=1

  postgres-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cross_border_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cross_border_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_ENVIRONMENT: test
      CATALOG_DATABASE_URL: postgresql+psycopg://postgres:ci-only-postgres-password@localhost:5432/cross_border_test
      CATALOG_JWT_SECRET: ci-only-long-random-secret-not-for-production
      CATALOG_CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/catalog-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic current

  frontend:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://127.0.0.1:8001
      E2E_API_BASE_URL: http://127.0.0.1:8001
      CATALOG_ENVIRONMENT: test
      CATALOG_DATABASE_URL: sqlite:///./e2e.sqlite3
      CATALOG_JWT_SECRET: ci-e2e-long-random-secret-not-for-production
      CATALOG_CORS_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
      CATALOG_FRONTEND_URL: http://127.0.0.1:3100
      CATALOG_SECURE_COOKIES: "false"
      CATALOG_PRIVILEGED_MFA_REQUIRED: "false"
      E2E_CUSTOMER_IDENTIFIER: e2e-customer
      E2E_CUSTOMER_PASSWORD: "C7!Violet-Cedar-CI-Only-2026"
      E2E_ADMIN_IDENTIFIER: e2e-admin
      E2E_ADMIN_PASSWORD: "A9!Quartz-River-CI-Only-2026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-next/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/catalog-service/requirements.txt
      - run: npm ci
        working-directory: apps/web-next
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web-next
      - run: npx tsc --noEmit
        working-directory: apps/web-next
      - run: npm run lint -- --quiet
        working-directory: apps/web-next
      - run: npm run build
        working-directory: apps/web-next
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web-next
      - run: npm run test:e2e:public
        working-directory: apps/web-next
      - run: pip install -r requirements.txt
        working-directory: services/catalog-service
      - run: python -m alembic upgrade head
        working-directory: services/catalog-service
      - run: python -m scripts.provision_e2e_accounts
        working-directory: services/catalog-service
      - name: Start test API
        working-directory: services/catalog-service
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > e2e-api.log 2>&1 &
          echo $! > e2e-api.pid
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8001/api/ready
      - run: npm run test:e2e:roles
        working-directory: apps/web-next

  containers:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - postgres-migrations
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose --profile gateway config
      - run: >-
          docker run --rm
          --add-host api:127.0.0.1
          --add-host web:127.0.0.1
          -v "$PWD/gateway/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.28-alpine nginx -t
      - run: docker compose build api web
