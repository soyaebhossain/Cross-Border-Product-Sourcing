services:
  - type: web
    name: cross-border-product-sourcing-api
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./services/catalog-service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: CATALOG_ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: CATALOG_DATABASE_URL
        fromDatabase:
          name: cross-border-product-sourcing-db
          property: connectionString
      # A new database is empty after migrations; load the PII-free demo
      # catalog. Existing rows are kept, so this is safe on every deploy.
      - key: CATALOG_SEED_PUBLIC_CATALOG
        value: "true"
      # First administrator, created once at startup (free plan has no shell).
      # Remove these three after the first admin sign-in.
      - key: SOURCEAI_ADMIN_USERNAME
        sync: false
      - key: SOURCEAI_ADMIN_EMAIL
        sync: false
      - key: SOURCEAI_ADMIN_PASSWORD
        sync: false
      - key: CATALOG_JWT_SECRET
        generateValue: true
      - key: CATALOG_MFA_ENCRYPTION_KEY
        sync: false
      - key: CATALOG_PRIVILEGED_MFA_REQUIRED
        value: "true"
      - key: CATALOG_FRONTEND_URL
        value: https://cross-border-product-sourcing.vercel.app
      - key: CATALOG_CORS_ORIGINS
        value: https://cross-border-product-sourcing.vercel.app
      - key: CATALOG_PROXY_SHARED_SECRET
        sync: false
      - key: CATALOG_SECURE_COOKIES
        value: "true"
      - key: CATALOG_MEDIA_PATH
        value: /app/media
      - key: CATALOG_AI_INSIGHTS_DATA_PATH
        value: /app/datasets/ml-starter-v1
      - key: CATALOG_REQUEST_LOG_LEVEL
        value: INFO
      - key: CATALOG_ERROR_MONITORING_ENVIRONMENT
        value: production
      - key: CATALOG_ERROR_MONITORING_DSN
        sync: false
      - key: CATALOG_ANTHROPIC_API_KEY
        sync: false
      - key: CATALOG_ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: CATALOG_FX_AUTO_REFRESH_ENABLED
        value: "true"
      - key: CATALOG_FX_REFRESH_INTERVAL_HOURS
        value: "12"
      - key: CATALOG_RESEND_API_KEY
        sync: false
      - key: CATALOG_RESEND_FROM_EMAIL
        sync: false
      - key: CATALOG_SMTP_HOST
        sync: false
      - key: CATALOG_SMTP_PORT
        value: "587"
      - key: CATALOG_SMTP_USERNAME
        sync: false
      - key: CATALOG_SMTP_PASSWORD
        sync: false
      - key: CATALOG_SMTP_FROM_EMAIL
        sync: false
      - key: CATALOG_SMTP_STARTTLS
        value: "true"
      - key: CATALOG_PASSWORD_RESET_SECONDS
        value: "1800"
      - key: CATALOG_PAYMENT_PROOF_ALLOWED_HOSTS
        sync: false

databases:
  - name: cross-border-product-sourcing-db
    plan: free
    region: singapore
    databaseName: cross_border
    user: sourceai
    # Only services in this Render workspace can connect.
    ipAllowList: []
