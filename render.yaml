services:
  - type: web
    name: cross-border-product-sourcing-api
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./services/catalog-service/Dockerfile
    dockerContext: ./services/catalog-service
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: CATALOG_ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: CATALOG_DATABASE_URL
        sync: false
      - key: CATALOG_JWT_SECRET
        generateValue: true
      - key: CATALOG_MFA_ENCRYPTION_KEY
        sync: false
      - key: CATALOG_PRIVILEGED_MFA_REQUIRED
        value: "true"
      - key: CATALOG_FRONTEND_URL
        value: https://cross-border-product-sourcing.vercel.app
      - key: CATALOG_CORS_ORIGINS
        value: https://cross-border-product-sourcing.vercel.app
      - key: CATALOG_SECURE_COOKIES
        value: "true"
      - key: CATALOG_MEDIA_PATH
        value: /app/media
      - key: CATALOG_REQUEST_LOG_LEVEL
        value: INFO
      - key: CATALOG_ERROR_MONITORING_ENVIRONMENT
        value: production
      - key: CATALOG_ERROR_MONITORING_DSN
        sync: false
      - key: CATALOG_RESEND_API_KEY
        sync: false
      - key: CATALOG_RESEND_FROM_EMAIL
        sync: false
      - key: CATALOG_SMTP_HOST
        sync: false
      - key: CATALOG_SMTP_PORT
        value: "587"
      - key: CATALOG_SMTP_USERNAME
        sync: false
      - key: CATALOG_SMTP_PASSWORD
        sync: false
      - key: CATALOG_SMTP_FROM_EMAIL
        sync: false
      - key: CATALOG_SMTP_STARTTLS
        value: "true"
      - key: CATALOG_PASSWORD_RESET_SECONDS
        value: "1800"
      - key: CATALOG_PAYMENT_PROOF_ALLOWED_HOSTS
        sync: false
