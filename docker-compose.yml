services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cross_border}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dev-only-postgres-password}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cross_border}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/catalog-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOG_ENVIRONMENT: "${CATALOG_ENVIRONMENT:-development}"
      CATALOG_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-only-postgres-password}@postgres:5432/${POSTGRES_DB:-cross_border}"
      CATALOG_JWT_SECRET: "${CATALOG_JWT_SECRET:-dev-only-not-for-production-change-me}"
      CATALOG_MFA_ENCRYPTION_KEY: "${CATALOG_MFA_ENCRYPTION_KEY:-}"
      CATALOG_PRIVILEGED_MFA_REQUIRED: "${CATALOG_PRIVILEGED_MFA_REQUIRED:-true}"
      CATALOG_CORS_ORIGINS: "${CATALOG_CORS_ORIGINS:-http://localhost:3000}"
      CATALOG_FRONTEND_URL: "${CATALOG_FRONTEND_URL:-http://localhost:3000}"
      CATALOG_SECURE_COOKIES: "${CATALOG_SECURE_COOKIES:-false}"
      CATALOG_GOOGLE_CLIENT_ID: "${CATALOG_GOOGLE_CLIENT_ID:-}"
      CATALOG_GOOGLE_CLIENT_SECRET: "${CATALOG_GOOGLE_CLIENT_SECRET:-}"
      CATALOG_MEDIA_PATH: "${CATALOG_MEDIA_PATH:-/app/media}"
      CATALOG_REQUEST_LOG_LEVEL: "${CATALOG_REQUEST_LOG_LEVEL:-INFO}"
      CATALOG_ERROR_MONITORING_DSN: "${CATALOG_ERROR_MONITORING_DSN:-}"
      CATALOG_ERROR_MONITORING_ENVIRONMENT: "${CATALOG_ERROR_MONITORING_ENVIRONMENT:-}"
      CATALOG_ERROR_MONITORING_TRACES_SAMPLE_RATE: "${CATALOG_ERROR_MONITORING_TRACES_SAMPLE_RATE:-0.05}"
      CATALOG_RELEASE_VERSION: "${CATALOG_RELEASE_VERSION:-}"
      CATALOG_NOTIFICATION_SENDER_NAME: "${CATALOG_NOTIFICATION_SENDER_NAME:-SourceAI}"
      CATALOG_NOTIFICATION_DISPATCH_BATCH_SIZE: "${CATALOG_NOTIFICATION_DISPATCH_BATCH_SIZE:-50}"
      CATALOG_SMTP_HOST: "${CATALOG_SMTP_HOST:-}"
      CATALOG_SMTP_PORT: "${CATALOG_SMTP_PORT:-587}"
      CATALOG_SMTP_USERNAME: "${CATALOG_SMTP_USERNAME:-}"
      CATALOG_SMTP_PASSWORD: "${CATALOG_SMTP_PASSWORD:-}"
      CATALOG_SMTP_FROM_EMAIL: "${CATALOG_SMTP_FROM_EMAIL:-}"
      CATALOG_SMTP_STARTTLS: "${CATALOG_SMTP_STARTTLS:-true}"
      CATALOG_SMS_WEBHOOK_URL: "${CATALOG_SMS_WEBHOOK_URL:-}"
      CATALOG_SMS_API_TOKEN: "${CATALOG_SMS_API_TOKEN:-}"
      CATALOG_SMS_SENDER_ID: "${CATALOG_SMS_SENDER_ID:-}"
      CATALOG_WHATSAPP_WEBHOOK_URL: "${CATALOG_WHATSAPP_WEBHOOK_URL:-}"
      CATALOG_WHATSAPP_API_TOKEN: "${CATALOG_WHATSAPP_API_TOKEN:-}"
      CATALOG_WHATSAPP_SENDER_ID: "${CATALOG_WHATSAPP_SENDER_ID:-}"
      CATALOG_PAYMENT_PROOF_ALLOWED_HOSTS: "${CATALOG_PAYMENT_PROOF_ALLOWED_HOSTS:-}"
      CATALOG_SUPPLY_CHAIN_CSV_PATH: "${CATALOG_SUPPLY_CHAIN_CSV_PATH:-/data/supply_chain_data.csv}"
      CATALOG_AUTOMATION_WEBHOOK_URL: "${CATALOG_AUTOMATION_WEBHOOK_URL:-http://n8n:5678/webhook/sourceai-quote-explanation}"
      CATALOG_AUTOMATION_WEBHOOK_TOKEN: "${N8N_AUTOMATION_TOKEN:-development-only-change-me}"
      CATALOG_AUTOMATION_TIMEOUT_SECONDS: "${CATALOG_AUTOMATION_TIMEOUT_SECONDS:-30}"
      CATALOG_AUTOMATION_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
    volumes:
      - ./Data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"

  notification-worker:
    build:
      context: ./services/catalog-service
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "scripts.dispatch_notifications", "--poll-seconds", "10"]
    restart: unless-stopped
    environment:
      CATALOG_ENVIRONMENT: "${CATALOG_ENVIRONMENT:-development}"
      CATALOG_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev-only-postgres-password}@postgres:5432/${POSTGRES_DB:-cross_border}"
      CATALOG_JWT_SECRET: "${CATALOG_JWT_SECRET:-dev-only-not-for-production-change-me}"
      CATALOG_MFA_ENCRYPTION_KEY: "${CATALOG_MFA_ENCRYPTION_KEY:-}"
      CATALOG_PRIVILEGED_MFA_REQUIRED: "${CATALOG_PRIVILEGED_MFA_REQUIRED:-true}"
      CATALOG_CORS_ORIGINS: "${CATALOG_CORS_ORIGINS:-http://localhost:3000}"
      CATALOG_FRONTEND_URL: "${CATALOG_FRONTEND_URL:-http://localhost:3000}"
      CATALOG_SECURE_COOKIES: "${CATALOG_SECURE_COOKIES:-false}"
      CATALOG_ERROR_MONITORING_DSN: "${CATALOG_ERROR_MONITORING_DSN:-}"
      CATALOG_ERROR_MONITORING_ENVIRONMENT: "${CATALOG_ERROR_MONITORING_ENVIRONMENT:-}"
      CATALOG_ERROR_MONITORING_TRACES_SAMPLE_RATE: "${CATALOG_ERROR_MONITORING_TRACES_SAMPLE_RATE:-0.05}"
      CATALOG_RELEASE_VERSION: "${CATALOG_RELEASE_VERSION:-}"
      CATALOG_NOTIFICATION_SENDER_NAME: "${CATALOG_NOTIFICATION_SENDER_NAME:-SourceAI}"
      CATALOG_NOTIFICATION_DISPATCH_BATCH_SIZE: "${CATALOG_NOTIFICATION_DISPATCH_BATCH_SIZE:-50}"
      CATALOG_SMTP_HOST: "${CATALOG_SMTP_HOST:-}"
      CATALOG_SMTP_PORT: "${CATALOG_SMTP_PORT:-587}"
      CATALOG_SMTP_USERNAME: "${CATALOG_SMTP_USERNAME:-}"
      CATALOG_SMTP_PASSWORD: "${CATALOG_SMTP_PASSWORD:-}"
      CATALOG_SMTP_FROM_EMAIL: "${CATALOG_SMTP_FROM_EMAIL:-}"
      CATALOG_SMTP_STARTTLS: "${CATALOG_SMTP_STARTTLS:-true}"
      CATALOG_SMS_WEBHOOK_URL: "${CATALOG_SMS_WEBHOOK_URL:-}"
      CATALOG_SMS_API_TOKEN: "${CATALOG_SMS_API_TOKEN:-}"
      CATALOG_SMS_SENDER_ID: "${CATALOG_SMS_SENDER_ID:-}"
      CATALOG_WHATSAPP_WEBHOOK_URL: "${CATALOG_WHATSAPP_WEBHOOK_URL:-}"
      CATALOG_WHATSAPP_API_TOKEN: "${CATALOG_WHATSAPP_API_TOKEN:-}"
      CATALOG_WHATSAPP_SENDER_ID: "${CATALOG_WHATSAPP_SENDER_ID:-}"
      CATALOG_PAYMENT_PROOF_ALLOWED_HOSTS: "${CATALOG_PAYMENT_PROOF_ALLOWED_HOSTS:-}"

  web:
    build:
      context: ./apps/web-next
      args:
        API_BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://api:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:3000:3000"

  ollama:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    profiles: ["automation"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  n8n:
    image: "${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}"
    profiles: ["automation"]
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:-development-only-change-this-encryption-key}"
      N8N_AUTOMATION_TOKEN: "${N8N_AUTOMATION_TOKEN:-development-only-change-me}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Asia/Dhaka}"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Required by the reviewed workflows for token, model and private URL lookup.
      # Do not allow untrusted users or community workflows on this instance.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  gateway:
    image: nginx:1.28-alpine
    profiles:
      - gateway
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
