events {}

http {
  server_tokens off;
  client_max_body_size 8m;

  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

  upstream sourceai_api {
    server api:8000;
    keepalive 32;
  }

  upstream sourceai_web {
    server web:3000;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /api/auth/login/ {
      limit_req zone=auth_per_ip burst=5 nodelay;
      proxy_pass http://sourceai_api;
    }

    location = /api/auth/register/ {
      limit_req zone=auth_per_ip burst=3 nodelay;
      proxy_pass http://sourceai_api;
    }

    location /api/ {
      proxy_pass http://sourceai_api;
    }

    location /media/ {
      proxy_pass http://sourceai_api;
    }

    location / {
      proxy_pass http://sourceai_web;
    }
  }
}
